settings:
  title: StepUp RepRep 4 Demonstration on the template repository
  width: 80
  height: 24
  shell:
    program: /usr/bin/sh
    prompt: "$ "
    line_split: ' \'
    quit_command: exit

instructions:
  - !Interactive
    command: sb -j 4 -w
    keys:
      - 16s
      - '?'
      - 4s
      - r
      - 8s
      - q
