# This workflow assumes that you deploy the documentation from the gh-pages branch.

name: mkdocs
on:
  push:
    branches:
      # Run on the main branch ...
      - main
    tags:
      # ... and on release tags ...
      - 'v*'
    paths:
      # ... and only if relevant files have changed.
      - stepup/**
      - docs/**
      - overrides/**
      - mkdocs.yaml
      - pyproject.toml
      - .github/workflows/mkdocs.yaml
  pull_request:
  # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - stepup/**
      - docs/**
      - overrides/**
      - mkdocs.yaml
      - pyproject.toml
      - .github/workflows/mkdocs.yaml

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Get the source
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install development version
        run: uv pip install --system -e .[dev]
      - name: Build mkdocs site
        run: mkdocs build --strict

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Get the source
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install development version
        run: uv pip install --system -e .[dev]

      # Update the site using the gh-pages branch with mike.
      - name: Get the docs branch
        run: git fetch --depth=1 origin gh-pages
      - name: Configure Git user for documentation commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Build docs snapshot
        run: mike deploy dev
      - name: Push gh-pages branch with development version of docs
        if: github.ref == 'refs/heads/main'
        run: git push origin gh-pages
      - name: Check if stable release tag
        id: stable_tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> $GITHUB_OUTPUT
          else
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi
      - name: Deploy gh-pages branch with stable version of docs
        if: steps.stable_tag.outputs.is_stable == 'true'
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MACRO_MESO=$(echo "${VERSION}" | cut -d. -f1,2)
          mike deploy ${MACRO_MESO} -u stable -p
