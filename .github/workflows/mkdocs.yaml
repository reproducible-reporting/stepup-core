# This workflow publishes a single, unversioned documentation site with GitHub Pages.
# The Pages source of the repository must be set to "GitHub Actions",
# not to a branch, for the deploy job to have any effect.

name: mkdocs
on:
  push:
    branches:
      # Every commit on the main branch republishes the site,
      # so that the documentation never lags behind the code.
      - main
  pull_request:
  # Build without publishing on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - stepup/**
      - docs/**
      - overrides/**
      - tools/make_stable_redirects.py
      - mkdocs.yaml
      - pyproject.toml
      - .github/workflows/mkdocs.yaml

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    timeout-minutes: 2
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Get the source
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install development version
        run: uv pip install --system -e .[dev]
      - name: Build mkdocs site
        run: mkdocs build --strict
      # The documentation used to be published per version with mike,
      # and search engines were pointed at the stable alias.
      # See tools/make_stable_redirects.py for when these stubs can be dropped.
      - name: Add redirects from the retired stable URLs
        run: python tools/make_stable_redirects.py site
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Publish documentation on GitHub Pages
    timeout-minutes: 2
    needs: build
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.0
