# Simply check that something works on macOS
name: smoke
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work) ...
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - docs/**
      - stepup/**
      - pyproject.toml
      - .github/workflows/smoke.yaml
  pull_request:
    # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - docs/**
      - stepup/**
      - pyproject.toml
      - .github/workflows/smoke.yaml

jobs:
  tests:
    name: Smoke tests
    timeout-minutes: 4
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            resolution: lowest-direct
          - python-version: '3.14'
            resolution: highest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install Graphviz
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install graphviz
      - name: Install with the test dependencies
        run: uv pip install --system --resolution ${{ matrix.resolution }} -e .[tests]
      - name: Run a simple example
        run: |
          cd docs
          STEPUP_DEBUG=1 STEPUP_SYNC_RPC_TIMEOUT=10 stepup build -j 1.0
