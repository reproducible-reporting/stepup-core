name: pytest
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work) ...
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .github/workflows/pytest.yaml
  pull_request:
    # Run tests on pull requests ...
    paths:
      # ... only if relevant files have changed.
      - stepup/**
      - tests/**
      - pyproject.toml
      - .github/workflows/pytest.yaml

# The steps are written for bash, which is the bash of Git for Windows on the Windows runners.
defaults:
  run:
    shell: bash

# The two jobs share their platforms and steps through YAML anchors,
# which are defined in the unit job and reused in the examples job.
jobs:
  unit:
    name: unit (${{ matrix.platform.runner }}, ${{ matrix.platform.python-version }}, ${{ matrix.platform.resolution }}, ${{ matrix.platform.watcher }}, ${{ matrix.platform.transport }})
    permissions:
      contents: read
    env: &env
      # Enforce strict checks instead of trying to repair fixable issues.
      STEPUP_DEBUG: 1
      # RPC timeout is set shorter to speed up tests in case of failures.
      STEPUP_SYNC_RPC_TIMEOUT: 10
      STEPUP_WATCHER: ${{ matrix.platform.watcher }}
      STEPUP_RPC_TRANSPORT: ${{ matrix.platform.transport }}
    strategy:
      matrix:
        # Every operating system is tested with the oldest supported Python
        # and the oldest versions of the direct dependencies,
        # and with the newest Python for which all dependencies can be installed.
        # The unit tests are cheap, so they also cover the settings that are not the default.
        platform:
          - &linux-oldest
            runner: ubuntu-24.04
            python-version: '3.11'
            resolution: lowest-direct
            watcher: asyncinotify
            transport: unix
            extras: tests
          - runner: ubuntu-24.04
            python-version: '3.11'
            resolution: lowest-direct
            watcher: watchfiles
            transport: tcp
            extras: tests,watchfiles
          - &linux-newest
            runner: ubuntu-26.04
            python-version: '3.15'
            resolution: highest
            watcher: asyncinotify
            transport: unix
            extras: tests
          - &linux-newest-watchfiles
            runner: ubuntu-26.04
            python-version: '3.15'
            resolution: highest
            watcher: watchfiles
            transport: unix
            extras: tests,watchfiles
          - &linux-newest-tcp
            runner: ubuntu-26.04
            python-version: '3.15'
            resolution: highest
            watcher: asyncinotify
            transport: tcp
            extras: tests
          - &macos-oldest
            runner: macos-26
            python-version: '3.11'
            resolution: lowest-direct
            watcher: watchfiles
            transport: unix
            extras: tests
          - &macos-newest
            runner: macos-26
            python-version: '3.15'
            resolution: highest
            watcher: watchfiles
            transport: unix
            extras: tests
          - runner: macos-26
            python-version: '3.15'
            resolution: highest
            watcher: watchfiles
            transport: tcp
            extras: tests
          # Windows has one watcher and one transport.
          - &windows-oldest
            runner: windows-2022
            python-version: '3.11'
            resolution: lowest-direct
            watcher: watchfiles
            transport: tcp
            extras: tests
          # As of November 2026, PyYAML has no Windows wheel for Python 3.15.
          - &windows-newest
            runner: windows-2025
            python-version: '3.14'
            resolution: highest
            watcher: watchfiles
            transport: tcp
            extras: tests
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - &checkout
        uses: actions/checkout@v6
        timeout-minutes: 3
        with:
          persist-credentials: false
      - &setup-python
        name: Set up Python ${{ matrix.platform.python-version }}
        id: python
        timeout-minutes: 3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python-version }}
      - &setup-uv
        name: Set up uv
        timeout-minutes: 3
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # The uv cache is handled by the steps below instead,
          # because setup-uv saves it only at the end of a successful job.
          # Test failures and cancelled jobs would then discard wheels that took long to build.
          enable-cache: false
      - &configure-uv-cache
        name: Configure the uv cache directory
        run: echo "UV_CACHE_DIR=${{ runner.temp }}/uv-cache" >> "$GITHUB_ENV"
      - &restore-uv-cache
        name: Restore the uv cache
        id: uv-cache
        timeout-minutes: 3
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ matrix.platform.runner }}-${{ steps.python.outputs.python-version }}-${{ matrix.platform.resolution }}-${{ matrix.platform.watcher }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: uv-${{ matrix.platform.runner }}-${{ steps.python.outputs.python-version }}-${{ matrix.platform.resolution }}-${{ matrix.platform.watcher }}-
      - &install
        name: Install with the test dependencies
        timeout-minutes: 3
        run: uv pip install --system --resolution ${{ matrix.platform.resolution }} -e .[${{ matrix.platform.extras }}]
      - &prune-uv-cache
        name: Prune the uv cache
        if: steps.uv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: uv cache prune --ci
      - &save-uv-cache
        name: Save the uv cache
        # Jobs with the same key race to save the cache.
        # Only the first one succeeds and the others merely log a warning.
        if: steps.uv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        uses: actions/cache/save@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - name: Run the unit tests
        timeout-minutes: 3
        run: pytest -vv -k "not test_example"

  # The examples run as separate jobs, because they dominate the run time.
  examples:
    name: ${{ matrix.suite.name }} (${{ matrix.platform.runner }}, ${{ matrix.platform.python-version }}, ${{ matrix.platform.resolution }}, ${{ matrix.platform.watcher }}, ${{ matrix.platform.transport }})
    permissions:
      contents: read
    env: *env
    strategy:
      matrix:
        suite:
          - name: examples-forkserver
            forkserver: 1
          - name: examples-subprocess
            forkserver: 0
        platform:
          - *linux-oldest
          - *linux-newest
          - *linux-newest-watchfiles
          - *linux-newest-tcp
          - *macos-oldest
          - *macos-newest
          - *windows-oldest
          - *windows-newest
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - *checkout
      - *setup-python
      - *setup-uv
      - *configure-uv-cache
      - *restore-uv-cache
      - *install
      - *prune-uv-cache
      - *save-uv-cache
      - name: Run the ${{ matrix.suite.name }} tests
        timeout-minutes: 30
        env:
          STEPUP_BUILD_FORKSERVER: ${{ matrix.suite.forkserver }}
        run: pytest -vv tests/test_examples.py
