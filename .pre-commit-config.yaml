repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
    - id: check-ast
    - id: check-case-conflict
    - id: check-executables-have-shebangs
      exclude: |
        (?x)^(
          tests/examples/error_plan_no_shebang/plan.py|
          tests/examples/error_runsh_no_shebang/simple.sh|
          tests/examples/error_runpy_no_shebang/simple.py
        )$
    - id: check-json
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-toml
    - id: check-vcs-permalinks
    - id: debug-statements
    - id: detect-private-key
    - id: destroyed-symlinks
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: pretty-format-json
      args: ["--autofix", "--no-sort-keys"]
    - id: trailing-whitespace
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
    - id: remove-crlf
- repo: https://github.com/reproducible-reporting/snipwise
  rev: v1.0.1
  hooks:
  - id: snipwise
    args: [fix]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.5
  hooks:
    - id: ruff-format
      types_or: [python, pyi, jupyter, markdown]
    - id: ruff-check
      args: ["--fix", "--show-fixes"]
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.39
  hooks:
  - id: pymarkdown
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.0
  hooks:
    - id: check-github-workflows
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse
- repo: https://github.com/reproducible-reporting/check-zenodo-json
  rev: v1.1.1
  hooks:
  - id: check-zenodo-json
